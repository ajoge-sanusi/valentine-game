<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .question {
            font-size: 28px;
            color: #333;
            margin-bottom: 40px;
            font-weight: bold;
            line-height: 1.3;
        }
        
        .name {
            color: #ff4d7e;
        }
        
        .buttons-container {
            position: relative;
            height: 180px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            border: 2px dashed #ff9a9e;
            border-radius: 15px;
            background: #fff9fb;
        }
        
        .btn {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }
        
        .btn-yes {
            background: #4CAF50;
            color: white;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        
        .btn-yes:hover {
            background: #45a049;
            transform: translateY(-50%) scale(1.05);
        }
        
        .btn-no {
            background: #f44336;
            color: white;
            position: absolute;
            /* NO TRANSITION - INSTANT MOVEMENT */
            transition: none !important;
            z-index: 5;
        }
        
        .comment {
            color: #666;
            font-size: 18px;
            font-style: italic;
            margin-top: 20px;
            min-height: 30px;
        }
        
        .result {
            font-size: 24px;
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
            min-height: 40px;
        }
        
        .heart {
            color: #ff4d7e;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            5% { transform: scale(1.1); }
            10% { transform: scale(1); }
            15% { transform: scale(1.1); }
            20% { transform: scale(1); }
        }
        
        .sensitivity-indicator {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 107, 139, 0.1);
            pointer-events: none;
            z-index: 2;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="question">
            <span class="name">😶</span> will you be my VAL?
        </div>
        
        <div class="buttons-container" id="buttonsContainer">
            <div class="sensitivity-indicator" id="sensitivityIndicator"></div>
            <button class="btn btn-yes" id="yesBtn">Yes</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
        
        <div class="comment" id="comment">
            "No" seems a bit shy 😁
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const comment = document.getElementById('comment');
            const result = document.getElementById('result');
            const buttonsContainer = document.getElementById('buttonsContainer');
            const sensitivityIndicator = document.getElementById('sensitivityIndicator');
            
            // Get container dimensions
            const containerRect = buttonsContainer.getBoundingClientRect();
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            // Calculate movement boundaries
            const minX = 10;
            const maxX = containerRect.width - btnWidth - 10;
            const minY = 10;
            const maxY = containerRect.height - btnHeight - 10;
            
            // Initialize NO button position (right side)
            let currentX = maxX - 50;
            let currentY = (maxY - minY) / 2;
            noBtn.style.left = `${currentX}px`;
            noBtn.style.top = `${currentY}px`;
            
            // NO TRANSITION - INSTANT MOVEMENT
            noBtn.style.transition = 'none';
            
            // Track mouse position
            let mouseX = 0;
            let mouseY = 0;
            
            // Show sensitivity zone (for debugging)
            let showSensitivity = false;
            
            // Update mouse position
            buttonsContainer.addEventListener('mousemove', function(e) {
                const rect = buttonsContainer.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
                
                // Update sensitivity indicator position
                if (showSensitivity) {
                    sensitivityIndicator.style.display = 'block';
                    sensitivityIndicator.style.left = (mouseX - 60) + 'px';
                    sensitivityIndicator.style.top = (mouseY - 60) + 'px';
                }
                
                checkProximityAndMove();
            });
            
            // Fast proximity check and movement
            function checkProximityAndMove() {
                // Calculate distance between mouse and button center
                const btnCenterX = currentX + btnWidth/2;
                const btnCenterY = currentY + btnHeight/2;
                
                const distance = Math.sqrt(
                    Math.pow(mouseX - btnCenterX, 2) + 
                    Math.pow(mouseY - btnCenterY, 2)
                );
                
                // EXTREMELY SENSITIVE - Move if within 150px!
                if (distance < 150) {
                    moveNoButtonFast();
                }
            }
            
            // SUPER FAST movement function
            function moveNoButtonFast() {
                // Calculate direction away from mouse
                const btnCenterX = currentX + btnWidth/2;
                const btnCenterY = currentY + btnHeight/2;
                
                // Vector from mouse to button
                const dx = btnCenterX - mouseX;
                const dy = btnCenterY - mouseY;
                
                // Normalize and scale
                const distance = Math.sqrt(dx * dx + dy * dy);
                const scale = distance > 0 ? 80 / distance : 1;
                
                // Calculate new position (run away from mouse)
                let newX = currentX + dx * scale * 2.5;
                let newY = currentY + dy * scale * 2.5;
                
                // Add some randomness for unpredictability
                newX += (Math.random() - 0.5) * 60;
                newY += (Math.random() - 0.5) * 60;
                
                // Keep within boundaries
                newX = Math.max(minX, Math.min(maxX, newX));
                newY = Math.max(minY, Math.min(maxY, newY));
                
                // Ensure minimum movement (at least 40px)
                const moveDistance = Math.sqrt(
                    Math.pow(newX - currentX, 2) + 
                    Math.pow(newY - currentY, 2)
                );
                
                if (moveDistance < 40) {
                    // Force a bigger movement
                    newX = minX + Math.random() * (maxX - minX);
                    newY = minY + Math.random() * (maxY - minY);
                }
                
                // INSTANT POSITION UPDATE - NO TRANSITION
                noBtn.style.left = `${newX}px`;
                noBtn.style.top = `${newY}px`;
                
                // Update current position
                currentX = newX;
                currentY = newY;
                
                // Add visual feedback (color flash)
                noBtn.style.backgroundColor = '#ff3333';
                setTimeout(() => {
                    noBtn.style.backgroundColor = '#f44336';
                }, 50);
            }
            
            // Also move when hovering directly over button
            noBtn.addEventListener('mouseenter', function(e) {
                moveNoButtonFast();
                // Move again quickly
                setTimeout(moveNoButtonFast, 50);
            });
            
            // Move on click attempt
            noBtn.addEventListener('mousedown', function(e) {
                e.preventDefault();
                // Move multiple times very fast
                moveNoButtonFast();
                setTimeout(moveNoButtonFast, 30);
                setTimeout(moveNoButtonFast, 60);
                setTimeout(moveNoButtonFast, 90);
            });
            
            // Mobile touch support
            noBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                moveNoButtonFast();
                setTimeout(moveNoButtonFast, 30);
                setTimeout(moveNoButtonFast, 60);
            });
            
            // Continuous checking for maximum sensitivity
            setInterval(checkProximityAndMove, 16); // ~60fps
            
            // YES button click
            yesBtn.addEventListener('click', function() {
                // Update YES button
                yesBtn.textContent = 'YAY! 💖';
                yesBtn.style.background = '#ff4d7e';
                yesBtn.style.transform = 'translateY(-50%) scale(1.1)';
                
                // Update messages
                comment.textContent = '';
                result.innerHTML = 'You made the right choice! <span class="heart">❤️</span> Happy Valentine\'s Day!';
                
                // Disable NO button movements
                noBtn.style.pointerEvents = 'none';
                noBtn.style.opacity = '0.6';
                noBtn.style.cursor = 'default';
                
                // Stop the continuous checking
                clearInterval(window.moveInterval);
                
                // Create celebration
                createHearts();
            });
            
            // Create falling hearts celebration
            function createHearts() {
                const colors = ['#ff4d7e', '#ff6b8b', '#ff9a9e', '#fad0c4'];
                
                for(let i = 0; i < 25; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.innerHTML = '❤️';
                        heart.style.position = 'fixed';
                        heart.style.left = Math.random() * 100 + 'vw';
                        heart.style.top = '-50px';
                        heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                        heart.style.zIndex = '9999';
                        heart.style.pointerEvents = 'none';
                        heart.style.fontWeight = 'bold';
                        document.body.appendChild(heart);
                        
                        // Animate falling
                        setTimeout(() => {
                            heart.style.transition = 'all 1.5s cubic-bezier(0.1, 0.8, 0.3, 1)';
                            heart.style.top = '100vh';
                            heart.style.opacity = '0';
                            heart.style.transform = `rotate(${Math.random() * 720}deg) scale(${0.5 + Math.random()})`;
                        }, 10);
                        
                        // Remove after animation
                        setTimeout(() => {
                            if(heart.parentNode) document.body.removeChild(heart);
                        }, 1600);
                    }, i * 70); // Fast hearts
                }
            }
            
            // Toggle sensitivity indicator with 's' key (for debugging)
            document.addEventListener('keydown', function(e) {
                if (e.key === 's' || e.key === 'S') {
                    showSensitivity = !showSensitivity;
                    sensitivityIndicator.style.display = showSensitivity ? 'block' : 'none';
                }
            });
        });
    </script>
</body>
</html>
